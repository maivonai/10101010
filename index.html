<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивный Кентавр</title>
    <style>
        :root {
            --primary: #e62727;
            --bg: #0d0f12;
            --text: #ffffff;
            --bg-light: #1a1e24;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
            position: relative;
        }

        /* Фон с частицами */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 20px;
            background: rgba(13, 15, 18, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }

        /* Логотип Кентавр */
        .logo-wrapper {
            margin: 20px auto;
            position: relative;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 0 20px rgba(230, 39, 39, 0.2));
            animation: float 4s ease-in-out infinite;
        }

        .logo-wrapper img {
            width: 250px;
            height: auto;
            max-width: 100%;
            display: block;
            transition: all 0.3s ease;
        }

        .logo-wrapper:hover {
            transform: scale(1.05) translateY(-5px);
            filter: drop-shadow(0 0 40px rgba(230, 39, 39, 0.8));
        }

        .logo-wrapper:active {
            animation: spin-ex 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes spin-ex {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-size: 1.2rem;
            color: #888;
            text-transform: uppercase;
        }

        /* Кнопки */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            background: var(--bg-light);
            border: none;
            color: var(--text);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1 1 120px;
            min-width: 100px;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: var(--primary);
            background: #222;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.95);
            background: var(--primary);
            color: #fff;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: #d11c1c;
        }

        footer {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #555;
            letter-spacing: 1px;
        }

        /* Конфетти */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 1000;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Эффект "Дискотека" */
        .disco-mode .logo-wrapper {
            animation: spin-ex 0.5s infinite, float 0.5s infinite alternate !important;
        }

        .disco-mode .container {
            animation: border-pulse 0.5s infinite alternate;
        }

        @keyframes border-pulse {
            from { border-color: red; box-shadow: 0 0 20px red; }
            to { border-color: blue; box-shadow: 0 0 20px blue; }
        }

        /* Светлая тема */
        body.light-mode {
            --bg: #f0f2f5;
            --text: #0d0f12;
            --bg-light: #ffffff;
        }

        body.light-mode .container {
            background: rgba(255, 255, 255, 0.6);
        }

        body.light-mode .logo-wrapper {
            filter: drop-shadow(0 0 30px rgba(230, 39, 39, 0.5));
        }

        @media (max-width: 600px) {
            .logo-wrapper img { width: 160px; }
            .btn { flex: 1 0 100%; }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="container" id="app-container">
        <div class="logo-wrapper" id="centaur-logo">
            <!-- ВСТАВЬТЕ СЮДА ССЫЛКУ НА ВАШЕ ИЗОБРАЖЕНИЕ ИЛИ БАЗОВЫЙ КОД SVG -->
            <img src="centaur.png" alt="Кентавр Шут" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 200 200\'><polygon points=\'100,20 120,40 140,30 130,60 150,80 140,100 150,120 180,110 170,140 140,150 130,170 120,180 90,170 70,180 50,160 30,170 40,140 20,120 30,90 20,60 40,40 60,20\' fill=\'%23e62727\'/></svg>'">
        </div>

        <h1>КЛИКНИ ПО КЕНТАВРУ ИЛИ ВВЕДИ "CENTAUR"</h1>

        <div class="controls">
            <button class="btn btn-primary" id="btn-confetti">🎉 Взрыв конфетти</button>
            <button class="btn" id="btn-spin">🌀 Закрутить</button>
            <button class="btn" id="btn-theme">🌙 Сменить тему</button>
            <button class="btn" id="btn-disco">💃 Пасхалка (Disco)</button>
        </div>

        <footer>Веб-сайт поколения 2026 // Разработано с ❤️ для тебя</footer>
    </div>

    <script>
        // ==========================================
        // 1. ФОНОВЫЕ ЧАСТИЦЫ (АНИМАЦИЯ)
        // ==========================================
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillStyle = 'rgba(13, 15, 18, 0.1)';
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // Параллакс мыши
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                if (Math.abs(dx) < 200 && Math.abs(dy) < 200) {
                    this.x -= dx * 0.01;
                    this.y -= dy * 0.01;
                }

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(230, 39, 39, ${this.opacity})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 120; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', () => {
            initCanvas();
            initParticles();
        });

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        initCanvas();
        initParticles();
        animateParticles();

        // ==========================================
        // 2. ИНТЕРАКТИВНОСТЬ ЛОГОТИПА И КНОПОК
        // ==========================================
        const logo = document.getElementById('centaur-logo');
        const btnConfetti = document.getElementById('btn-confetti');
        const btnSpin = document.getElementById('btn-spin');
        const btnTheme = document.getElementById('btn-theme');
        const btnDisco = document.getElementById('btn-disco');
        const body = document.body;

        // Аудио-эффект для кентавра (без внешних файлов)
        function playBeep(freq=440, duration=300, type='sine') {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = context.createOscillator();
            const gainNode = context.createGain();
            oscillator.type = type;
            oscillator.frequency.value = freq;
            gainNode.gain.setValueAtTime(0.5, context.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, context.currentTime + duration / 1000);
            oscillator.connect(gainNode);
            gainNode.connect(context.destination);
            oscillator.start();
            oscillator.stop(context.currentTime + duration / 1000);
        }

        logo.addEventListener('click', (e) => {
            logo.style.transform = 'scale(1.2)';
            setTimeout(() => logo.style.transform = '', 300);
            playBeep(600, 200, 'square');
            spawnConfetti(e.clientX, e.clientY, 30);
        });

        // ==========================================
        // 3. ВЗРЫВ КОНФЕТТИ
        // ==========================================
        function spawnConfetti(x, y, count = 150) {
            const colors = ['#e62727', '#ffd700', '#00ffcc', '#ff69b4', '#4da6ff'];
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                const size = Math.random() * 10 + 5;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 20 + 5;

                el.style.left = (x - size/2) + 'px';
                el.style.top = (y - size/2) + 'px';
                el.style.width = size + 'px';
                el.style.height = size * (Math.random() * 2 + 1) + 'px';
                el.style.background = color;
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                el.style.transform = `rotate(${Math.random() * 360}deg)`;
                el.style.animationDuration = (Math.random() * 2 + 1) + 's';

                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }
        }

        btnConfetti.addEventListener('click', () => {
            spawnConfetti(window.innerWidth / 2, window.innerHeight / 2);
            playBeep(440);
        });

        btnSpin.addEventListener('click', () => {
            logo.style.animation = 'spin-ex 1s ease';
            setTimeout(() => logo.style.animation = 'float 4s ease-in-out infinite', 1000);
        });

        btnTheme.addEventListener('click', () => {
            body.classList.toggle('light-mode');
            btnTheme.textContent = body.classList.contains('light-mode') ? '☀️ День' : '🌙 Ночь';
        });

        // ==========================================
        // 4. ПАСХАЛКА: DISCO MODE (Кнопка + Клавиши)
        // ==========================================
        btnDisco.addEventListener('click', () => {
            body.classList.toggle('disco-mode');
            playBeep(300, 100, 'sawtooth');
            setTimeout(() => playBeep(600, 100, 'sawtooth'), 150);
            setTimeout(() => playBeep(900, 100, 'sawtooth'), 300);
            if(!body.classList.contains('disco-mode')) {
                document.querySelectorAll('.confetti-piece').forEach(el => el.remove());
            }
        });

        // Пасхалка "Кодовое слово": C, E, N, T, A, U, R
        const secretCode = ['c', 'e', 'n', 't', 'a', 'u', 'r'];
        let codeIndex = 0;
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === secretCode[codeIndex]) {
                codeIndex++;
                playBeep(500 + (codeIndex * 50));
                if (codeIndex === secretCode.length) {
                    codeIndex = 0;
                    spawnConfetti(logo.getBoundingClientRect().left + 100, logo.getBoundingClientRect().top + 100, 300);
                    body.classList.add('disco-mode');
                    playBeep(800, 500, 'sawtooth');
                }
            } else {
                codeIndex = 0;
            }
        });

        // Пасхалка в консоли!
        console.log('%c 🔥 ТЫ НАШЕЛ МЕНЯ, КЕНТАВР! 🔥', 'color: #e62727; font-size: 24px; font-weight: bold;');
        console.log('%cТы искал интерактивность — и получил её сполна.', 'color: #aaa; font-size: 14px;');
    </script>
</body>
</html>
